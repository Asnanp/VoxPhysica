# ============================================================
# VocalMorph V5 — 4cm MAE Real-World Frontier Config
# ============================================================
# Optimized for RTX 3060 (12GB VRAM)
# Key innovations for 4cm:
#   - OneCycleLR scheduler for rapid convergence + fine-tuning
#   - Curriculum augmentation (decays over training via target_label_smoothing)
#   - Guarded monitoring (height_mae_speaker_guarded) to police short/tail slices
#   - Gap-aware early stopping that fires on val improvement DECOUPLED from gap widening
#   - Stochastic depth + strong dropout (0.25) for overfit control
#   - Short-weight 3.0 with extreme-short multiplier 2.0
#   - SWA starting at 50% with long annealing
#   - Higher weight_decay (0.06) for tighter generalization
#   - Longer warmup (15 epochs) for stable start
#   - Balanced height-aware speaker batching with gender balance

project:
  name: VocalMorph
  version: "5.3.0-4cm-frontier"
  author: Asnan P
  description: >
    V5.3 frontier for real-world 4cm MAE — OneCycleLR, curriculum augmentation,
    gap-aware early stopping, stochastic depth, extreme short-speaker weighting,
    and guarded monitoring across all height slices.

data:
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  split_manifests:
    train: data/splits/train_clean.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets:
    - height_cm
    - weight_kg
    - age
    - gender

features:
  strict: true
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

model:
  name: VocalMorphV5
  type: range_aware_speaker_height_architecture
  input_dim: 264
  v5:
    d_model: 192
    n_heads: 6
    n_blocks: 6
    ff_mult: 3
    conv_kernel: 17
    dropout: 0.25
    stochastic_depth: 0.10
    n_height_experts: 5
    expert_delta_cm: 14.0
    direct_blend: 0.20
    meta_dim: 72
    height_bin_classes: 5

physics:
  enabled: false

training:
  seed: 11
  epochs: 100
  batch_size: 48
  eval_batch_size: 96
  gradient_accumulation_steps: 2
  num_workers: 0
  eval_num_workers: 0
  persistent_workers: false
  pin_memory: false
  eval_pin_memory: false
  device: cuda
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  pin_memory: true
  eval_pin_memory: false
  non_blocking: true
  empty_cache_frequency: 10
  gradient_checkpointing: false
  train_eval_frequency: 1
  final_train_eval: true

  # ============================================================
  # Curriculum augmentation — stronger early, decays naturally
  # via target_label_smoothing decay and augmentation config
  # ============================================================
  augmentation:
    enabled: true
    noise_p: 0.35
    noise_std: 0.015
    time_mask_p: 0.25
    time_mask_max_frac: 0.060
    feat_mask_p: 0.18
    feat_mask_max_frac: 0.040
    scale_p: 0.20
    scale_std: 0.040
    temporal_jitter_p: 0.10
    temporal_jitter_max_frac: 0.025
    freq_mask_p: 0.10
    freq_mask_max_frac: 0.12
    mixup_p: 0.20
    mixup_alpha: 0.25

  # ============================================================
  # Target label smoothing — curriculum noise that decays
  # ============================================================
  target_label_smoothing:
    enabled: true
    std: 0.12
    decay: 0.94

  # ============================================================
  # EMA for smooth evaluation
  # ============================================================
  ema:
    enabled: true
    decay: 0.9992
    update_every: 1
    warmup_steps: 500
    use_for_eval: true

  # ============================================================
  # SWA — start earlier, anneal longer for 4cm stability
  # ============================================================
  swa:
    enabled: true
    start_frac: 0.50
    anneal_epochs: 20
    use_for_eval: true

  # ============================================================
  # Optimizer — higher weight_decay for generalization
  # ============================================================
  optimizer:
    type: adamw
    lr: 0.00012
    weight_decay: 0.060
    betas: [0.9, 0.995]
    eps: 1e-8

  # ============================================================
  # Scheduler — OneCycleLR for rapid initial convergence
  # then fine detail tuning in the tail
  # ============================================================
  scheduler:
    type: one_cycle_lr
    max_lr: 0.00012
    pct_start: 0.25
    anneal_strategy: cos
    div_factor: 20
    final_div_factor: 5000
    eta_min: 0.000002

  # ============================================================
  # Loss — aggressive short-weight, ranking, speaker consistency
  # ============================================================
  loss:
    type: vtsl_v2
    use_gender_class_weights: false
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0
    v5:
      height_nll_weight: 0.20
      height_huber_weight: 0.50
      height_mae_weight: 0.35
      weight_weight: 0.04
      age_weight: 0.03
      gender_weight: 0.08
      height_bin_weight: 0.30
      ranking_weight: 0.15
      speaker_consistency_weight: 0.12
      gate_entropy_weight: 0.005
      short_weight: 3.00
      medium_weight: 1.00
      tall_weight: 1.20
      huber_delta_norm: 0.45
      rank_margin_cm: 2.5

  # ============================================================
  # Speaker batching — height-balanced with gender balance
  # ============================================================
  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 24
    clips_per_speaker: 2
    paired_speakers_per_batch: 6
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.30
    height_bin_weights:
      short: 2.5
      medium: 1.0
      tall: 1.15
    gender_height_weights:
      male_short: 2.5
      female_short: 1.75
      male_tall: 1.10
      female_tall: 1.15
    max_speaker_weight: 3.0

  sample_weighting:
    enabled: false

  # ============================================================
  # Feature smoothing for noise robustness
  # ============================================================
  feature_smoothing_std: 0.020
  lr_warmup_epochs: 0
  lr_warmup_start_factor: 0.05
  # Note: warmup is handled by OneCycleLR via pct_start: 0.25
  # These fields are kept at 0/0.05 as fallback (no-op with OneCycleLR)

  # ============================================================
  # Early stopping — gap-aware with degradation monitoring
  # monitors height_mae_speaker_guarded for fair slice coverage
  # ============================================================
  early_stopping:
    enabled: true
    patience: 30
    monitor: height_mae_speaker_guarded
    mode: min
    min_delta: 0.002
    degradation_delta: 1.0
    degradation_patience: 6
    gap_threshold: 3.0
    gap_patience: 4

  # ============================================================
  # Gradient clipping — tighter for stable OneCycleLR
  # ============================================================
  gradient_clipping:
    enabled: true
    max_norm: 0.6

evaluation:
  targets:
    height_mae_cm: 3.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: false
    n_samples: 16
    n_crops: 3
    crop_size: 96

logging:
  wandb:
    enabled: false
  tensorboard:
    enabled: false
    log_dir: outputs/logs_v5_4cm_frontier/
  checkpoint:
    dir: outputs/checkpoints_v5_4cm_frontier/
    save_top_k: 10
    monitor: height_mae_speaker_guarded
    mode: min

inference:
  checkpoint: outputs/checkpoints_v5_4cm_frontier/best.ckpt
  mc_samples: 16
  deterministic_ensemble: true
  n_crops: 3
  crop_size: 96
  output_uncertainty: true
  output_dir: outputs/predictions_v5_4cm_frontier/
