project:
  name: VocalMorph
  version: "5.2.0-max12gb"
  author: Codebuff
  description: |
    V5.2 MAX for 12GB VRAM. d_model=224, 6 blocks, ff_mult=4.
    NISP+TIMIT+CELEB filtered. SWA enabled. Ensemble member seed.

data:
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  split_manifests:
    train: data/splits/train_plus_heightceleb_filtered.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets: [height_cm, weight_kg, age, gender]

features:
  strict: true
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

model:
  name: VocalMorphV5
  type: direct_first_range_corrected
  input_dim: 264
  v5:
    d_model: 224
    n_heads: 8
    n_blocks: 6
    ff_mult: 4
    conv_kernel: 17
    dropout: 0.20
    n_height_experts: 3
    expert_delta_cm: 18.0
    direct_blend: 0.90
    meta_dim: 64
    height_bin_classes: 5

physics:
  enabled: false

training:
  seed: 42
  epochs: 200
  batch_size: 32
  eval_batch_size: 128
  gradient_accumulation_steps: 4
  num_workers: 4
  eval_num_workers: 2
  persistent_workers: true
  prefetch_factor: 2
  eval_prefetch_factor: 2
  device: cuda
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  pin_memory: true
  eval_pin_memory: false
  non_blocking: true
  empty_cache_frequency: 10
  gradient_checkpointing: false
  train_eval_frequency: 0
  final_train_eval: false

  augmentation:
    enabled: true
    noise_p: 0.18
    noise_std: 0.007
    time_mask_p: 0.10
    time_mask_max_frac: 0.035
    feat_mask_p: 0.07
    feat_mask_max_frac: 0.020
    scale_p: 0.10
    scale_std: 0.020
    temporal_jitter_p: 0.04
    temporal_jitter_max_frac: 0.012
    freq_mask_p: 0.0
    freq_mask_max_frac: 0.0
    mixup_p: 0.30
    mixup_alpha: 0.20

  ema:
    enabled: true
    decay: 0.998
    update_every: 1
    warmup_steps: 0
    use_for_eval: true

  swa:
    enabled: true
    start_frac: 0.75
    anneal_epochs: 10
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.000035
    weight_decay: 0.080
    betas: [0.9, 0.995]
    eps: 1e-8

  scheduler:
    type: cosine_annealing
    T_max: 200
    eta_min: 0.000003

  loss:
    type: vtsl_v2
    use_gender_class_weights: false
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0
    v5:
      height_nll_weight: 0.0
      height_huber_weight: 0.50
      height_mae_weight: 0.40
      weight_weight: 0.0
      age_weight: 0.0
      gender_weight: 0.08
      height_bin_weight: 0.0
      ranking_weight: 0.0
      speaker_consistency_weight: 0.05
      gate_entropy_weight: 0.0
      short_weight: 1.40
      medium_weight: 1.00
      tall_weight: 1.10
      huber_delta_norm: 0.50
      rank_margin_cm: 2.5

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 16
    clips_per_speaker: 2
    paired_speakers_per_batch: 2
    singleton_speakers_per_batch: 5
    balance_gender: true
    gender_balance_strength: 0.15
    height_bin_weights:
      short: 1.25
      medium: 1.0
      tall: 1.10
    gender_height_weights:
      male_short: 1.25
      female_short: 1.10
      male_tall: 1.05
      female_tall: 1.05
    max_speaker_weight: 1.65

  sample_weighting:
    enabled: false

  target_label_smoothing:
    enabled: false
    std: 0.0
    decay: 1.0

  feature_smoothing_std: 0.003
  lr_warmup_epochs: 12
  lr_warmup_start_factor: 0.10

  early_stopping:
    enabled: true
    patience: 40
    monitor: height_mae_speaker
    mode: min
    min_delta: 0.001
    degradation_delta: 1.25
    degradation_patience: 7

  gradient_clipping:
    enabled: true
    max_norm: 0.8

evaluation:
  targets:
    height_mae_cm: 3.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: false
    deterministic: true
    n_samples: 1
    n_crops: 1
    crop_size: 96

logging:
  wandb:
    enabled: false
  tensorboard:
    enabled: false
    log_dir: outputs/logs_v5_max12gb/
  checkpoint:
    dir: outputs/checkpoints_v5_max12gb/
    save_top_k: 10
    monitor: height_mae_speaker
    mode: min

inference:
  checkpoint: outputs/checkpoints_v5_max12gb/best.ckpt
  mc_samples: 8
  deterministic_ensemble: true
  n_crops: 3
  crop_size: 96
  output_uncertainty: true
  output_dir: outputs/predictions_v5_max12gb/
