# ==============================================================================
#  VocalMorph V2 FULL POWER Config
#  Target: sub-4cm MAE, push toward 3cm
#  Every single architecture feature enabled.
#  Physics branch, cross-attention, VTSL loss, formant-height consistency,
#  reliability gate, height prior, domain adversarial, diversity loss, mixup,
#  ranking loss, speaker consistency, uncertainty calibration, shoulder/waist
#  heads, Kendall auto-weighting.
#  Aggressive short-speaker upweighting (3-4x).
#  Uses pre-extracted 264-dim SSL-fused features.
# ==============================================================================

project:
  name: VocalMorph
  version: "3.0.0-FULL-POWER"
  description: >
    Full power config with every feature enabled.
    Targets sub-4cm MAE via physics-informed dual-path architecture,
    aggressive short-speaker weighting, and 7-seed ensemble.

# ==============================================================================
#  FEATURE LAYOUT
#  Required by build_vocalmorph_v2() to construct PhysicsFeatureSpec
#  264-dim input = 40 MFCC (x3 = 120) + 5 spectral + 8 formant (F1-F4 freq+bw)
#                  + F0 + spacing + VTL + 128 SSL embeddings
# ==============================================================================
features:
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

data:
  features_dir: data/features_v4_combo_full_ssl/
  skip_feature_contract_validation: true
  targets:
    - height_cm
    - weight_kg
    - age
    - gender

model:
  name: VocalMorphV2
  type: rtx3060_full_power
  input_dim: 264

  # ============================================================================
  #  ALL V2 PARAMS are forwarded to ModelHyperparameters / LossWeights /
  #  AblationToggles / etc. via build_vocalmorph_v2()
  # ============================================================================
  v2:
    # --- MAX CAPACITY (fits RTX 3060 12GB with batch_size=24, num_workers=0) ---
    ecapa_channels: 512
    ecapa_scale: 8
    conformer_d_model: 256
    conformer_heads: 8
    conformer_blocks: 4
    dropout: 0.40
    branch_dropout: 0.15
    drop_path_rate: 0.05
    regression_hidden_dim: 256
    physics_embedding_dim: 128
    physics_fusion_dim: 128
    fused_dim: 256
    physics_gate_hidden_dim: 96
    physics_gate_floor: 0.10
    physics_gate_curriculum_epochs: 25
    uncertainty_samples: 5
    uncertainty_crops: 1

    # --- MIXUP (in-model, same-gender, same-domain) ---
    mixup_alpha: 0.3
    mixup_probability: 0.50
    focal_after_epoch: 5
    focal_gamma: 2.0
    focal_ema_decay: 0.95
    robust_huber_weight: 0.20
    ranking_margin: 0.10
    domain_classes: 3

    # --- SPEAKER-LEVEL AGGREGATION ---
    aggregation:
      method: legacy_inverse_variance
      omega_mad_z: 2.5
      omega_min_survivors: 3
      omega_huber_delta_scale: 1.25

    # --- CLIP RELIABILITY ---
    reliability:
      mode: learned
      use_feature_drift: true
      min_weight: 0.05
      hidden_dim: 48
      embedding_dim: 24

    # --- PHYSICS CONSTANTS ---
    constants:
      spacing_min_hz: 250.0
      spacing_max_hz: 1150.0
      default_spacing_hz: 700.0
      vtl_min_cm: 10.0
      vtl_max_cm: 35.0
      prior_tanh_scale: 0.35
      physics_residual_tanh_scale: 0.25
      domain_correction_base: 0.85
      domain_correction_range: 0.30
      ranking_height_threshold_cm: 2.0

    # --- ALL TOGGLES ENABLED ---
    toggles:
      use_physics_branch: true
      use_cross_attention: true
      use_reliability_gate: true
      use_height_prior: true
      use_height_adapter: true
      use_domain_adv: true
      use_diversity_loss: true
      use_feature_mixup: true
      use_feature_normalization: true
      use_acoustic_physics_consistency: true
      use_ranking_loss: true
      use_speaker_consistency: true
      use_uncertainty_calibration: true
      use_shoulder_head: true
      use_waist_head: true
      use_kendall_weights: true

    # --- LOSS WEIGHTS (Kendall will auto-balance) ---
    loss_weights:
      height: 5.0
      weight: 0.50
      age: 0.30
      shoulder: 0.30
      waist: 0.30
      gender: 0.30
      vtsl: 0.30
      formant_height_consistency: 0.05
      physics_penalty: 0.15
      domain_adv: 0.05
      ranking: 0.10
      height_bin: 0.50
      diversity: 0.50
      speaker_consistency: 0.08
      uncertainty_calibration: 0.04

training:
  seed: 11
  epochs: 200
  batch_size: 24
  gradient_accumulation_steps: 4
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  device: auto
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  pin_memory: true
  non_blocking: true
  empty_cache_frequency: 5
  gradient_checkpointing: true
  use_channels_last: false
  train_eval_frequency: 0
  final_train_eval: false

  # --- ON-THE-FLY AUGMENTATION ---
  augmentation:
    enabled: true
    noise_p: 0.30
    noise_std: 0.012
    time_mask_p: 0.20
    time_mask_max_frac: 0.06
    feat_mask_p: 0.15
    feat_mask_max_frac: 0.04
    scale_p: 0.15
    scale_std: 0.035
    temporal_jitter_p: 0.10
    temporal_jitter_max_frac: 0.025
    freq_mask_p: 0.0
    freq_mask_max_frac: 0.0
    mixup_p: 0.0
    mixup_alpha: 0.0

  # --- EMA ---
  ema:
    enabled: true
    decay: 0.999
    update_every: 1
    warmup_steps: 1000
    use_for_eval: true

  # --- SWA ---
  swa:
    enabled: false

  # --- OPTIMIZER ---
  optimizer:
    type: adamw
    lr: 0.000065
    weight_decay: 0.070
    betas: [0.9, 0.999]
    eps: 1e-8

  # --- SCHEDULER ---
  scheduler:
    type: cosine_annealing
    T_max: 80
    eta_min: 0.000004

  # --- SPEAKER BATCHING ---
  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 10
    clips_per_speaker: 2
    paired_speakers_per_batch: 4
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.30
    height_bin_weights:
      short: 2.50
      medium: 1.20
      tall: 1.10
    gender_height_weights:
      male_short: 3.00
      female_short: 2.50
      male_tall: 1.10
      female_tall: 1.10
    max_speaker_weight: 3.00

  sample_weighting:
    enabled: false

  # --- SPEAKER ALIGNMENT (CRITICAL FOR SHORT SPEAKERS) ---
  speaker_alignment:
    enable_pooled_height: true
    enable_consistency: true
    enable_ranking: true
    pooling_method: omega
    consistency_mode: pairwise_weighted
    warmup_start_epoch: 2
    warmup_end_epoch: 12
    pooled_height_weight_max: 0.60
    consistency_weight_max: 0.06
    ranking_weight_max: 0.10
    ranking_min_height_delta_cm: 3.0
    ranking_margin_cm: 0.5
    consistency_max_combined_std_cm: 4.5
    height_bin_loss_start_epoch: 1

    # 3x weight on short speakers
    height_bin_loss_weight_short: 3.00
    height_bin_loss_weight_medium: 1.30
    height_bin_loss_weight_tall: 1.10
    height_bin_loss_weight_male_short: 3.50
    height_bin_loss_weight_female_short: 3.00
    height_bin_loss_weight_male_tall: 1.00
    height_bin_loss_weight_female_tall: 1.10
    height_extreme_short_cm: 152.0
    height_extreme_tall_cm: 190.0
    height_extreme_loss_weight_short: 4.00
    height_extreme_loss_weight_tall: 1.15
    height_bin_prior_blend: 0.20
    height_bin_prior_short_cm: 156.0
    height_bin_prior_medium_cm: 168.0
    height_bin_prior_tall_cm: 183.0

    # Distribution matching
    height_distribution_weight_max: 0.20
    height_distribution_start_epoch: 2
    height_distribution_min_items: 10
    height_distribution_std_weight: 1.00
    height_distribution_range_weight: 0.30
    height_distribution_tail_weight: 0.20

  target_label_smoothing:
    enabled: false

  feature_smoothing_std: 0.015
  lr_warmup_epochs: 8
  lr_warmup_start_factor: 0.05

  # --- EARLY STOPPING ---
  early_stopping:
    enabled: true
    patience: 50
    monitor: height_mae_speaker_balanced
    mode: min
    min_delta: 0.0005
    degradation_delta: 1.50
    degradation_patience: 6

  # --- GRADIENT CLIPPING ---
  gradient_clipping:
    enabled: true
    max_norm: 0.5

evaluation:
  targets:
    height_mae_cm: 3.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: true
    n_samples: 1
    n_crops: 7
    crop_size: 128

logging:
  wandb:
    enabled: false
    project: VocalMorph
    entity: asnanp
  tensorboard:
    enabled: true
    log_dir: outputs/logs_full_power/
  checkpoint:
    dir: outputs/checkpoints_full_power/
    save_top_k: 12
    monitor: height_mae_speaker_balanced
    mode: min

inference:
  checkpoint: outputs/checkpoints_full_power/best.ckpt
  mc_samples: 200
  deterministic_ensemble: true
  n_crops: 10
  crop_size: 128
  tta_augmentation:
    enabled: true
    n_augmentations: 5
    noise_std: 0.005
    time_shift_max: 0.02
  output_uncertainty: true
  output_dir: outputs/predictions_full_power/
  quality_gate:
    enabled: true
    strict: true
    min_capture_quality_score: 0.55
    min_speech_ratio: 0.55
    min_snr_db: 10.0
    max_distance_cm: 30.0
    max_clipped_ratio: 0.03
    require_quality_ok: false
    min_accepted_clips: 3
    max_height_std_cm: 8.0
    min_confidence_score: 0.35
    max_ood_zscore: 4.0
  audio_enhancement:
    enabled: true
    vad_aggressiveness: 2
    spectral_gate_strength: 1.35
    spectral_gate_floor: 0.10
    trim_db: 28.0
    min_speech_ratio: 0.45
    min_snr_db: 8.0
    max_clipped_ratio: 0.02
    max_distance_cm: 45.0
