# ==============================================================================
#  VocalMorph V5 — 4cm MAE FULL POWER Config
#  Combines underground beefy model + frontier short-weighting + R-Drop
#  Target: 4cm speaker-level MAE on held-out test
# ==============================================================================

project:
  name: VocalMorph
  version: "5.5.0-4cm-FULL-POWER"
  author: Asnan P
  description: >
    All-in 4cm push: underground 19.8M-param model, adaptive bin weighting,
    R-Drop, OneCycleLR, SWA, EMA, aggressive short-speaker batching,
    gap-aware early stopping, single-seed 5h training cap.

data:
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  split_manifests:
    train: data/splits/train_clean.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets:
    - height_cm
    - weight_kg
    - age
    - gender

features:
  strict: true
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

model:
  name: VocalMorphV5
  type: range_aware_speaker_height_architecture
  input_dim: 264
  v5:
    d_model: 256
    n_heads: 8
    n_blocks: 8
    ff_mult: 4
    conv_kernel: 15
    dropout: 0.20
    stochastic_depth: 0.05
    n_height_experts: 7
    expert_delta_cm: 12.0
    direct_blend: 0.15
    meta_dim: 80
    height_bin_classes: 5

physics:
  enabled: false

training:
  seed: 11
  max_hours: 5
  epochs: 150
  batch_size: 48
  eval_batch_size: 96
  gradient_accumulation_steps: 2
  num_workers: 0
  eval_num_workers: 0
  persistent_workers: false
  pin_memory: false
  eval_pin_memory: false
  device: cuda
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  non_blocking: true
  empty_cache_frequency: 10
  gradient_checkpointing: false
  train_eval_frequency: 1
  final_train_eval: true

  augmentation:
    enabled: true
    noise_p: 0.35
    noise_std: 0.012
    time_mask_p: 0.25
    time_mask_max_frac: 0.060
    feat_mask_p: 0.18
    feat_mask_max_frac: 0.040
    scale_p: 0.20
    scale_std: 0.040
    temporal_jitter_p: 0.10
    temporal_jitter_max_frac: 0.025
    freq_mask_p: 0.10
    freq_mask_max_frac: 0.12
    mixup_p: 0.20
    mixup_alpha: 0.25
    total_epochs: 150

  target_label_smoothing:
    enabled: true
    std: 0.10
    decay: 0.96

  ema:
    enabled: true
    decay: 0.9995
    update_every: 1
    warmup_steps: 1000
    use_for_eval: true

  swa:
    enabled: true
    start_frac: 0.55
    anneal_epochs: 25
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.00008
    weight_decay: 0.08
    betas: [0.9, 0.995]
    eps: 1e-8

  scheduler:
    type: one_cycle_lr
    max_lr: 0.00008
    pct_start: 0.33
    anneal_strategy: cos
    div_factor: 12
    final_div_factor: 8000
    eta_min: 0.000001

  loss:
    type: vtsl_v2
    use_gender_class_weights: false
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0
    v5:
      height_nll_weight: 0.20
      height_huber_weight: 0.55
      height_mae_weight: 0.30
      weight_weight: 0.04
      age_weight: 0.02
      gender_weight: 0.08
      height_bin_weight: 0.35
      ranking_weight: 0.0
      speaker_consistency_weight: 0.05
      gate_entropy_weight: 0.0
      short_weight: 3.00
      medium_weight: 1.00
      tall_weight: 1.20
      huber_delta_norm: 0.45
      rank_margin_cm: 2.5
      adaptive_weighting: true
      adaptive_ramp_epochs: 20

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 24
    clips_per_speaker: 2
    paired_speakers_per_batch: 6
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.30
    height_bin_weights:
      short: 3.0
      medium: 1.0
      tall: 1.15
    gender_height_weights:
      male_short: 3.0
      female_short: 2.0
      male_tall: 1.10
      female_tall: 1.15
    max_speaker_weight: 3.5

  sample_weighting:
    enabled: false

  feature_smoothing_std: 0.015
  lr_warmup_epochs: 0
  lr_warmup_start_factor: 0.05

  rdrop:
    enabled: true
    weight: 0.8

  early_stopping:
    enabled: true
    patience: 40
    monitor: height_mae_speaker_guarded
    mode: min
    min_delta: 0.001
    degradation_delta: 1.0
    degradation_patience: 8
    gap_threshold: 3.5
    gap_patience: 5

  gradient_clipping:
    enabled: true
    max_norm: 0.5

evaluation:
  targets:
    height_mae_cm: 4.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: false
    n_samples: 16
    n_crops: 5
    crop_size: 128

logging:
  wandb:
    enabled: false
  tensorboard:
    enabled: false
    log_dir: outputs/logs_v5_4cm_full_power/
  checkpoint:
    dir: outputs/checkpoints_v5_4cm_full_power/
    save_top_k: 12
    monitor: height_mae_speaker_guarded
    mode: min

inference:
  checkpoint: outputs/checkpoints_v5_4cm_full_power/best.ckpt
  mc_samples: 16
  deterministic_ensemble: true
  n_crops: 5
  crop_size: 128
  output_uncertainty: true
  output_dir: outputs/predictions_v5_4cm_full_power/