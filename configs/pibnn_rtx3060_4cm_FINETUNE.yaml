# ==============================================================================
#  VocalMorph V5 — 4cm FINETUNE Config (continuation of ULTIMATE run)
# ==============================================================================
#  Why this config exists:
#    The ULTIMATE run found its best basin at epoch ~23-27 (val height 4.57cm)
#    while OneCycleLR was still RAMPING UP (peak at epoch 75 of 250). The rising
#    LR pulled the model out of the basin (4.57 -> 4.67 and climbing).
#
#  Fixes vs ULTIMATE:
#    1. Resume MODEL-ONLY from best.ckpt -> fresh, short, DECAYING schedule
#       (max_lr 3.5e-5 ~ current LR, 10% warmup, anneal to ~0 over 40 epochs)
#    2. STANDARD monitor everywhere: height_mae_speaker (not guarded)
#    3. SWA active in this run: starts at 30% (epoch 12), anneal 10
#    4. Fine-tune-phase augmentation: noise/mixup reduced (curriculum tail)
#    5. Label smoothing reduced (0.12 -> 0.05) for sharper convergence
#  Usage:
#    python scripts/train.py --config configs/pibnn_rtx3060_4cm_FINETUNE.yaml \
#        --resume outputs/checkpoints_v5_4cm_ultimate/best.ckpt --model-only-resume \
#        --device cuda --target-mae-cm 4.0 --target-monitor height_mae \
#        --stop-only-on-target --no-max-hours
# ==============================================================================

project:
  name: VocalMorph
  version: "5.7.0-4cm-FINETUNE"
  author: Codebuff
  description: >
    Fine-tune continuation of the ULTIMATE run: model-only resume from the
    epoch-23 basin, short decaying schedule, standard speaker-MAE monitor, SWA.

data:
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  split_manifests:
    train: data/splits/train_plus_heightceleb_filtered.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets:
    - height_cm
    - weight_kg
    - age
    - gender

features:
  strict: true
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

model:
  name: VocalMorphV5
  type: range_aware_speaker_height_architecture
  input_dim: 264
  v5:
    d_model: 224
    n_heads: 7
    n_blocks: 6
    ff_mult: 4
    conv_kernel: 17
    dropout: 0.30
    stochastic_depth: 0.15
    n_height_experts: 5
    expert_delta_cm: 14.0
    direct_blend: 0.20
    meta_dim: 72
    height_bin_classes: 5

physics:
  enabled: false

training:
  seed: 42
  epochs: 40                # Short horizon: schedule decays from now
  max_hours: null
  batch_size: 48
  eval_batch_size: 96
  gradient_accumulation_steps: 1
  num_workers: 2
  eval_num_workers: 2
  persistent_workers: true
  prefetch_factor: 4
  eval_prefetch_factor: 4
  pin_memory: true
  eval_pin_memory: false
  non_blocking: true
  device: cuda
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  empty_cache_frequency: 10
  gradient_checkpointing: false
  train_eval_frequency: 0
  final_train_eval: false

  # Fine-tune-phase augmentation: lighter than warmup phase
  augmentation:
    enabled: true
    noise_p: 0.25
    noise_std: 0.015
    time_mask_p: 0.25
    time_mask_max_frac: 0.060
    feat_mask_p: 0.20
    feat_mask_max_frac: 0.050
    scale_p: 0.20
    scale_std: 0.040
    temporal_jitter_p: 0.10
    temporal_jitter_max_frac: 0.025
    freq_mask_p: 0.10
    freq_mask_max_frac: 0.12
    mixup_p: 0.15
    mixup_alpha: 0.20

  target_label_smoothing:
    enabled: true
    std: 0.05
    decay: 0.94

  ema:
    enabled: true
    decay: 0.9995
    update_every: 1
    warmup_steps: 200
    use_for_eval: true

  # SWA usable within this short run: starts epoch 12, anneals 10
  swa:
    enabled: true
    start_frac: 0.30
    anneal_epochs: 10
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.000035            # ~ current LR at the basin; pure fine-tune regime
    weight_decay: 0.10
    betas: [0.9, 0.995]
    eps: 1e-8

  # Short OneCycle: tiny warmup, mostly cosine decay to ~zero
  scheduler:
    type: one_cycle_lr
    max_lr: 0.000035
    pct_start: 0.10
    anneal_strategy: cos
    div_factor: 10
    final_div_factor: 3500
    eta_min: 0.000001

  loss:
    type: vtsl_v2
    use_gender_class_weights: false
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0
    v5:
      height_nll_weight: 0.20
      height_huber_weight: 0.50
      height_mae_weight: 0.35
      weight_weight: 0.04
      age_weight: 0.02
      gender_weight: 0.08
      height_bin_weight: 0.30
      ranking_weight: 0.0
      speaker_consistency_weight: 0.08
      gate_entropy_weight: 0.0
      short_weight: 3.50
      medium_weight: 1.00
      tall_weight: 1.20
      huber_delta_norm: 0.45
      rank_margin_cm: 2.5
      adaptive_weighting: true
      adaptive_ramp_epochs: 5   # already ramped in prior run; ramp fast here

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 24
    clips_per_speaker: 2
    paired_speakers_per_batch: 6
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.30
    height_bin_weights:
      short: 3.0
      medium: 1.0
      tall: 1.15
    gender_height_weights:
      male_short: 3.0
      female_short: 2.0
      male_tall: 1.10
      female_tall: 1.15
    max_speaker_weight: 3.5

  sample_weighting:
    enabled: false

  feature_smoothing_std: 0.015
  lr_warmup_epochs: 0

  rdrop:
    enabled: true
    weight: 1.0

  target_stopping:
    enabled: true
    monitor: height_mae
    mode: min
    value: 4.0
    stop_only: true

  # STANDARD monitor: plain speaker-level height MAE
  early_stopping:
    enabled: true
    patience: 12
    monitor: height_mae_speaker
    mode: min
    min_delta: 0.001
    degradation_delta: 1.0
    degradation_patience: 8
    gap_threshold: 3.5
    gap_patience: 5

  gradient_clipping:
    enabled: true
    max_norm: 0.5

evaluation:
  targets:
    height_mae_cm: 4.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: false
    n_samples: 16
    n_crops: 5
    crop_size: 128

logging:
  wandb:
    enabled: false
  tensorboard:
    enabled: false
    log_dir: outputs/logs_v5_4cm_finetune/
  checkpoint:
    dir: outputs/checkpoints_v5_4cm_finetune/
    save_top_k: 12
    monitor: height_mae_speaker
    mode: min

inference:
  checkpoint: outputs/checkpoints_v5_4cm_finetune/best.ckpt
  mc_samples: 16
  deterministic_ensemble: true
  n_crops: 5
  crop_size: 128
  output_uncertainty: true
  output_dir: outputs/predictions_v5_4cm_finetune/
