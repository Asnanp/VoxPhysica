# ============================================================
# VocalMorph V4.2 - HeightCeleb/VoxCeleb expanded training
# ============================================================
# Uses train_plus_heightceleb.csv:
#   base train speakers: 775
#   HeightCeleb/VoxCeleb train-only speakers: 1211
#   combined train speakers: 1986
# Val/test stay sealed on the original clean splits.

project:
  name: VocalMorph-V4-Biology-HeightCeleb
  version: "4.2.0"
  author: Asnan P
  description: >
    Expanded-data V4 run using VoxCeleb1 clips labeled by HeightCeleb.
    This attacks the true bottleneck: too few training speakers and weak
    height-bin coverage, especially compared with the sealed test speakers.

data:
  features_dir: data/features_v4_heightceleb/
  split_manifests:
    train: data/splits/train_plus_heightceleb.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  sample_rate: 16000
  skip_feature_contract_validation: true

features:
  strict: false
  require_parselmouth: false
  normalize_spectral: true
  mfcc:
    n_mfcc: 40
    n_fft: 512
    hop_length: 160
    win_length: 400
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4
    max_formant: 5500
    window_length: 0.025
  pitch:
    method: praat
    min_pitch: 50
    max_pitch: 500
  vtl:
    estimate: true
    speed_of_sound: 34000

model:
  name: VocalMorphV4
  input_dim: 136
  v4:
    adapter_dim: 256
    adapter_heads: 8
    adapter_blocks: 2
    adapter_ff_expansion: 3
    adapter_conv_kernel: 15
    dropout: 0.16
    pool_hidden: 128
    tower_hidden: 256
    meta_dim: 13
    meta_hidden: 64
    use_ssl_backbone: false
    ssl_model_name: "facebook/wav2vec2-base"
    ssl_freeze: true
    ssl_layers_to_use: 4

training:
  seed: 37
  epochs: 80
  batch_size: 128
  gradient_accumulation_steps: 1
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  device: cuda
  amp: true
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  feature_smoothing_std: 0.0015

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 32
    clips_per_speaker: 4
    height_bin_weights:
      short: 2.2
      medium: 1.0
      tall: 1.10
    gender_height_weights:
      male_short: 2.5
      female_short: 1.20
      male_medium: 1.0
      female_medium: 1.0
      male_tall: 1.0
      female_tall: 1.0
    source_weights:
      TIMIT: 1.35
      NISP: 1.00
      CELEB: 0.18
      HEIGHTCELEB: 0.18
      VOXCELEB: 0.18
      EXTERNAL: 0.18
    max_speaker_weight: 3.75
    balance_gender: true
    gender_balance_strength: 0.25

  sample_weighting:
    enabled: false

  augmentation:
    enabled: true
    noise_p: 0.06
    noise_std: 0.0025
    time_mask_p: 0.06
    time_mask_max_frac: 0.020
    feat_mask_p: 0.04
    feat_mask_max_frac: 0.012
    scale_p: 0.06
    scale_std: 0.012
    temporal_jitter_p: 0.02
    temporal_jitter_max_frac: 0.008
    freq_mask_p: 0.0
    freq_mask_max_frac: 0.0
    mixup_p: 0.0
    mixup_alpha: 0.0

  ema:
    enabled: true
    decay: 0.998
    update_every: 1
    warmup_steps: 250
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.00008
    weight_decay: 0.012
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: cosine_annealing
    T_max: 80
    eta_min: 0.000001

  loss:
    huber_delta: 0.75
    huber_weight: 0.45
    mae_weight: 0.45
    smoothl1_weight: 0.10
    gender_weight: 0.08
    label_smoothing: 0.03
    height_bin_loss_weight_short: 1.45
    height_bin_loss_weight_medium: 1.00
    height_bin_loss_weight_tall: 1.05
    height_bin_loss_weight_male_short: 1.60
    height_bin_loss_weight_female_short: 1.10
    height_extreme_short_cm: 152.0
    height_extreme_tall_cm: 190.0
    height_extreme_loss_weight_short: 1.25
    height_extreme_loss_weight_tall: 1.05
    source_loss_weight_timit: 1.15
    source_loss_weight_nisp: 1.00
    source_loss_weight_external: 0.20

  lr_warmup_epochs: 6
  lr_warmup_start_factor: 0.10

  early_stopping:
    enabled: true
    patience: 16
    monitor: height_mae_speaker_balanced
    mode: min

  gradient_clipping:
    enabled: true
    max_norm: 1.0

logging:
  tensorboard:
    enabled: false
    log_dir: outputs/v4_heightceleb/logs/
  checkpoint:
    dir: outputs/v4_heightceleb/checkpoints/
    save_top_k: 3
    monitor: height_mae_speaker_balanced
    mode: min

evaluation:
  targets:
    height_mae_cm: 3.0
    speaker_balanced_mae_cm: 4.0
