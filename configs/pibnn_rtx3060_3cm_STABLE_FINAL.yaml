project:
  name: VocalMorph
  version: "2.20.0-STABLE-FINAL"
  author: Asnan P
  description: STABLE CONFIG - Fixed training instability, realistic 3.5cm target

data:
  nisp_dir: data/nisp/
  raw_dir: data/raw/
  processed_dir: data/processed/
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  augmented_dir: data/augmented/
  split_manifests:
    train: data/splits/train_clean.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets:
    - height_cm
    - weight_kg
    - age
    - gender
  sample_rate: 16000
  max_audio_duration: 10
  min_audio_duration: 2
  split:
    train: 0.80
    val: 0.10
    test: 0.10
    stratify_by: source_gender_height_age_weight
    random_seed: 95

features:
  strict: true
  require_parselmouth: true
  normalize_spectral: true
  audit:
    strict_backend_check: true
    require_parselmouth: true
  mfcc:
    n_mfcc: 40
    n_fft: 512
    hop_length: 160
    win_length: 400
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4
    max_formant: 5500
    window_length: 0.025
  pitch:
    method: praat
    min_pitch: 50
    max_pitch: 500
  spectral:
    centroid: true
    rolloff: true
    flux: true
    bandwidth: true
    contrast: true
  vtl:
    estimate: true
    speed_of_sound: 34000
  voice_quality:
    jitter: true
    shimmer: true
    hnr: true

model:
  name: VocalMorphV2
  type: rtx3060_stable_final
  input_dim: 264
  v2:
    domain_classes: 3
    # MODERATE CAPACITY - Proven to work
    ecapa_channels: 256  # REDUCED from 512 for stability
    ecapa_scale: 4  # REDUCED from 8
    ecapa_embedding_dim: 128  # REDUCED from 192
    conformer_d_model: 128  # REDUCED from 256
    conformer_heads: 4  # REDUCED from 8
    conformer_blocks: 3  # REDUCED from 4
    
    # VERY STRONG REGULARIZATION
    dropout: 0.40  # REDUCED from 0.45
    branch_dropout: 0.18  # REDUCED from 0.20
    drop_path_rate: 0.04  # REDUCED from 0.05
    
    regression_hidden_dim: 256  # REDUCED from 384
    mixup_alpha: 0.0
    mixup_probability: 0.0
    
    # MODERATE FOCAL LOSS
    focal_after_epoch: 5  # LATER than 3
    focal_gamma: 1.0  # REDUCED from 1.5
    focal_ema_decay: 0.98
    
    robust_huber_weight: 0.22
    
    aggregation:
      method: legacy_inverse_variance
      omega_mad_z: 2.5
      omega_min_survivors: 3
      omega_huber_delta_scale: 1.25
    
    reliability:
      mode: handcrafted
      use_feature_drift: true
      min_weight: 0.05
      hidden_dim: 32
      embedding_dim: 16
    
    constants:
      spacing_min_hz: 485.7143
      spacing_max_hz: 1700.0
      default_spacing_hz: 1050.0
      vtl_min_cm: 10.0
      vtl_max_cm: 35.0
      prior_tanh_scale: 0.0
      physics_residual_tanh_scale: 0.0
    
    toggles:
      use_physics_branch: false
      use_cross_attention: false
      use_reliability_gate: false
      use_height_prior: false
      use_height_adapter: true
      use_domain_adv: false
      use_diversity_loss: false
      use_feature_mixup: false
      use_feature_normalization: true
      use_acoustic_physics_consistency: false
      use_ranking_loss: true
      use_speaker_consistency: false
      use_uncertainty_calibration: true
      use_shoulder_head: false
      use_waist_head: false
      use_kendall_weights: false
    
    loss_weights:
      height: 5.0  # REDUCED from 6.0
      weight: 0.18
      age: 0.04
      shoulder: 0.0
      waist: 0.0
      gender: 0.10
      vtsl: 0.0
      formant_height_consistency: 0.0
      physics_penalty: 0.0
      domain_adv: 0.0
      ranking: 0.12  # REDUCED from 0.15
      height_bin: 0.22  # INCREASED from 0.20
      diversity: 0.0
      speaker_consistency: 0.0
      uncertainty_calibration: 0.04  # REDUCED from 0.05

physics:
  enabled: false
  vtl_height_constraint:
    enabled: false
    ratio: 6.7
    penalty_weight: 0.0
  formant_vtl_constraint:
    enabled: false
    speed_of_sound: 34000
    penalty_weight: 0.0
  f0_gender_constraint:
    enabled: false
    male_f0_range: [85, 180]
    female_f0_range: [165, 265]
    penalty_weight: 0.0

training:
  seed: 11
  epochs: 120  # INCREASED from 100
  batch_size: 64  # INCREASED from 48 for stability
  gradient_accumulation_steps: 1  # REDUCED from 2
  num_workers: 0  # CHANGED to 0 for Windows compatibility
  persistent_workers: false
  prefetch_factor: null
  device: auto
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  pin_memory: true
  non_blocking: true
  empty_cache_frequency: 8  # INCREASED from 5
  gradient_checkpointing: false  # DISABLED for stability
  use_channels_last: false
  train_eval_frequency: 0
  final_train_eval: false

  # MODERATE AUGMENTATION
  augmentation:
    enabled: true
    noise_p: 0.18  # REDUCED from 0.25
    noise_std: 0.008  # REDUCED from 0.010
    time_mask_p: 0.10  # REDUCED from 0.15
    time_mask_max_frac: 0.04  # REDUCED from 0.05
    feat_mask_p: 0.08  # REDUCED from 0.10
    feat_mask_max_frac: 0.025  # REDUCED from 0.03
    scale_p: 0.10  # REDUCED from 0.12
    scale_std: 0.025  # REDUCED from 0.030
    temporal_jitter_p: 0.05  # REDUCED from 0.08
    temporal_jitter_max_frac: 0.015  # REDUCED from 0.020
    freq_mask_p: 0.0
    freq_mask_max_frac: 0.0
    mixup_p: 0.0
    mixup_alpha: 0.0

  ema:
    enabled: true
    decay: 0.998  # REDUCED from 0.999 for faster adaptation
    update_every: 1
    warmup_steps: 800  # REDUCED from 1000
    use_for_eval: true

  swa:
    enabled: true
    start_frac: 0.75  # LATER than 0.70
    anneal_epochs: 15  # INCREASED from 12
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.000050  # REDUCED from 0.000070 for STABILITY
    weight_decay: 0.065  # REDUCED from 0.080
    betas: [0.9, 0.999]
    eps: 1e-8

  scheduler:
    type: cosine_annealing
    T_max: 60  # INCREASED from 50
    eta_min: 0.000005  # REDUCED from 0.000008

  loss:
    type: vtsl_v2
    task_weights:
      height: 5.0
      weight: 0.18
      age: 0.04
      gender: 0.10
      vtsl: 0.0
      formant_height_consistency: 0.0
      physics_penalty: 0.0
      domain_adv: 0.0
    use_gender_class_weights: false
    physics_penalty_weight: 0.0
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 32  # REDUCED from 36 for stability
    clips_per_speaker: 3
    paired_speakers_per_batch: 4
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.20  # REDUCED from 0.25
    height_bin_weights:
      short: 1.40  # REDUCED from 1.50
      medium: 1.30  # REDUCED from 1.40
      tall: 1.10
    gender_height_weights:
      male_short: 1.50  # REDUCED from 1.60
      female_short: 1.15  # REDUCED from 1.20
      male_tall: 1.00
      female_tall: 1.00
    max_speaker_weight: 1.80  # REDUCED from 2.00

  sample_weighting:
    enabled: false

  speaker_alignment:
    enable_pooled_height: true
    enable_consistency: true
    enable_ranking: true
    pooling_method: omega
    consistency_mode: variance
    warmup_start_epoch: 2
    warmup_end_epoch: 8
    pooled_height_weight_max: 0.45
    consistency_weight_max: 0.04
    ranking_weight_max: 0.06
    ranking_min_height_delta_cm: 4.0
    ranking_margin_cm: 0.7
    consistency_max_combined_std_cm: 5.5
    height_bin_loss_start_epoch: 1
    height_bin_loss_weight_short: 1.40  # REDUCED from 1.50
    height_bin_loss_weight_medium: 1.25  # REDUCED from 1.30
    height_bin_loss_weight_tall: 1.08  # REDUCED from 1.10
    height_bin_loss_weight_male_short: 1.50  # REDUCED from 1.60
    height_bin_loss_weight_female_short: 1.15  # REDUCED from 1.20
    height_bin_loss_weight_male_tall: 1.00
    height_bin_loss_weight_female_tall: 1.05
    height_extreme_short_cm: 152.0
    height_extreme_tall_cm: 190.0
    height_extreme_loss_weight_short: 1.60  # REDUCED from 1.70
    height_extreme_loss_weight_tall: 1.08  # REDUCED from 1.10
    height_bin_prior_blend: 0.32  # INCREASED from 0.30
    height_bin_prior_short_cm: 154.0
    height_bin_prior_medium_cm: 167.5
    height_bin_prior_tall_cm: 184.0
    height_distribution_weight_max: 0.12  # REDUCED from 0.15
    height_distribution_start_epoch: 1
    height_distribution_min_items: 12
    height_distribution_std_weight: 1.00
    height_distribution_range_weight: 0.20
    height_distribution_tail_weight: 0.15

  target_label_smoothing:
    enabled: false
    std: 0.0
    decay: 1.0

  feature_smoothing_std: 0.012  # REDUCED from 0.015
  lr_warmup_epochs: 5  # REDUCED from 6
  lr_warmup_start_factor: 0.10  # INCREASED from 0.08

  early_stopping:
    enabled: true
    patience: 25  # REDUCED from 30
    monitor: height_mae_speaker_balanced
    mode: min
    min_delta: 0.001  # INCREASED from 0.0008
    degradation_delta: 1.50  # INCREASED from 1.30 - more tolerant
    degradation_patience: 8  # INCREASED from 5 - more tolerant

  gradient_clipping:
    enabled: true
    max_norm: 0.5  # INCREASED from 0.4

evaluation:
  targets:
    height_mae_cm: 3.5  # REALISTIC target
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: true
    n_samples: 1
    n_crops: 1
    crop_size: 96

logging:
  wandb:
    enabled: false
    project: VocalMorph
    entity: asnanp
  tensorboard:
    enabled: true
    log_dir: outputs/logs_rtx3060_stable_final/
  checkpoint:
    dir: outputs/checkpoints_rtx3060_stable_final/
    save_top_k: 8
    monitor: height_mae_speaker_balanced
    mode: min

inference:
  checkpoint: outputs/checkpoints_rtx3060_stable_final/best.ckpt
  mc_samples: 80
  deterministic_ensemble: true
  n_crops: 3
  crop_size: 96
  output_uncertainty: true
  output_dir: outputs/predictions_rtx3060_stable_final/
  quality_gate:
    enabled: true
    strict: true
    min_capture_quality_score: 0.55
    min_speech_ratio: 0.55
    min_snr_db: 10.0
    max_distance_cm: 30.0
    max_clipped_ratio: 0.03
    require_quality_ok: false
    min_accepted_clips: 3
    max_height_std_cm: 8.0
    min_confidence_score: 0.35
    max_ood_zscore: 4.0
  audio_enhancement:
    enabled: true
    vad_aggressiveness: 2
    spectral_gate_strength: 1.35
    spectral_gate_floor: 0.10
    trim_db: 28.0
    min_speech_ratio: 0.45
    min_snr_db: 8.0
    max_clipped_ratio: 0.02
    max_distance_cm: 45.0
