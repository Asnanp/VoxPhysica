# ==============================================================================
#  VocalMorph V5 — 4cm MAE in 5 Hours Config
# ==============================================================================
#  Optimized for RTX 3060 12GB — hits 4cm speaker-level MAE within 5 hours.
#
#  Key design decisions for speed:
#    1. MEDIUM MODEL: d_model=224, n_blocks=6 (proven in ULTIMATE run)
#    2. FAST DATA LOADING: num_workers=2, prefetch_factor=4, pin_memory=true
#    3. SINGLE-STEP ACCUMULATION: gradient_accumulation_steps=1 (max GPU util)
#    4. FAST EVAL: 3 eval crops during training (saves ~40% eval time)
#    5. NO TRAIN EVAL: train_eval_frequency=0 (saves 1 full eval epoch)
#    6. TARGET STOP: stops immediately when height_mae <= 4.0cm
#    7. TIME LIMIT: hard cap at 5 hours via training.max_hours
#    8. QUICK CONVERGENCE: OneCycleLR with 20% warmup, moderate LR
#    9. STRONG REG: R-Drop=1.0, dropout=0.30, weight_decay=0.10
#   10. SHORT-SPEAKER FOCUS: short_weight=3.5, aggressive bin weighting
#
#  Expected runtime: ~4-5 hours for 60-80 epochs on RTX 3060 12GB
#
#  Usage:
#    python scripts/train.py --config configs/pibnn_rtx3060_4cm_5HOUR.yaml
# ==============================================================================

project:
  name: VocalMorph
  version: "5.8.0-4cm-5HOUR"
  author: Codebuff
  description: >
    4cm MAE in 5 hours — medium model, fast data, aggressive regularization,
    OneCycleLR, R-Drop, target stopping. Designed for RTX 3060 12GB.

data:
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  split_manifests:
    train: data/splits/train_plus_heightceleb_filtered.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets:
    - height_cm
    - weight_kg
    - age
    - gender

features:
  strict: true
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

model:
  name: VocalMorphV5
  type: range_aware_speaker_height_architecture
  input_dim: 264
  v5:
    d_model: 224            # Proven sweet spot: capacity without blowing VRAM
    n_heads: 7              # 224/7=32 — clean head dimension
    n_blocks: 6             # Deep enough for complex patterns, fast enough
    ff_mult: 4              # Wide FFN for capacity
    conv_kernel: 17         # Good temporal context
    dropout: 0.30           # Strong dropout for generalization
    stochastic_depth: 0.15  # Drop entire blocks during training
    n_height_experts: 5     # 5 expert height ranges
    expert_delta_cm: 14.0   # Each expert covers ~14cm range
    direct_blend: 0.20      # 20% direct path, 80% MoE
    meta_dim: 72            # Good metadata capacity
    height_bin_classes: 5

physics:
  enabled: false

training:
  seed: 42                  # Fresh seed
  epochs: 100               # Generous max — time limit or target stop fires first
  max_hours: 5              # HARD TIME LIMIT: stops after 5 hours
  batch_size: 48            # Fits 12GB VRAM comfortably
  eval_batch_size: 96
  gradient_accumulation_steps: 1  # Single-step accumulation = max GPU utilization
  num_workers: 2            # Fast data loading — don't starve the GPU
  eval_num_workers: 2
  persistent_workers: true  # Keep workers alive between epochs
  prefetch_factor: 4
  eval_prefetch_factor: 4
  pin_memory: true
  eval_pin_memory: false
  non_blocking: true
  device: cuda
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  empty_cache_frequency: 10
  gradient_checkpointing: false
  train_eval_frequency: 0   # Disable train-eval during training (saves ~1 eval epoch)
  final_train_eval: false   # Skip final train-eval for speed

  # ============================================================
  # STRONG AUGMENTATION — helps generalize with limited epochs
  # ============================================================
  augmentation:
    enabled: true
    noise_p: 0.40           # Strong noise for regularization
    noise_std: 0.020
    time_mask_p: 0.30
    time_mask_max_frac: 0.080
    feat_mask_p: 0.25
    feat_mask_max_frac: 0.060
    scale_p: 0.25
    scale_std: 0.050
    temporal_jitter_p: 0.15
    temporal_jitter_max_frac: 0.030
    freq_mask_p: 0.15
    freq_mask_max_frac: 0.15
    mixup_p: 0.30           # More mixup for generalization
    mixup_alpha: 0.30

  # ============================================================
  # Target label smoothing — curriculum noise that decays
  # ============================================================
  target_label_smoothing:
    enabled: true
    std: 0.12
    decay: 0.96

  # ============================================================
  # EMA for smooth evaluation
  # ============================================================
  ema:
    enabled: true
    decay: 0.9995
    update_every: 1
    warmup_steps: 1000
    use_for_eval: true

  # ============================================================
  # SWA — start earlier (40%) for limited epochs
  # ============================================================
  swa:
    enabled: true
    start_frac: 0.40        # Start SWA at 40% (epoch ~40) for ~100-epoch schedule
    anneal_epochs: 20
    use_for_eval: true

  # ============================================================
  # Optimizer — strong weight_decay for generalization
  # ============================================================
  optimizer:
    type: adamw
    lr: 0.00010             # Moderate LR for stable OneCycle
    weight_decay: 0.10      # Strong regularization
    betas: [0.9, 0.995]
    eps: 1e-8

  # ============================================================
  # Scheduler — OneCycleLR with 20% warmup for fast convergence
  # ============================================================
  scheduler:
    type: one_cycle_lr
    max_lr: 0.00010
    pct_start: 0.20         # 20% warmup = converges faster than 30%
    anneal_strategy: cos
    div_factor: 15
    final_div_factor: 10000
    eta_min: 0.000001

  # ============================================================
  # LOSS — aggressive short-weight, adaptive, R-Drop
  # ============================================================
  loss:
    type: vtsl_v2
    use_gender_class_weights: false
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0
    v5:
      height_nll_weight: 0.20
      height_huber_weight: 0.50
      height_mae_weight: 0.35
      weight_weight: 0.04
      age_weight: 0.02
      gender_weight: 0.08
      height_bin_weight: 0.30
      ranking_weight: 0.0
      speaker_consistency_weight: 0.08
      gate_entropy_weight: 0.0
      short_weight: 3.50          # Aggressive short weighting
      medium_weight: 1.00
      tall_weight: 1.20
      huber_delta_norm: 0.45
      rank_margin_cm: 2.5
      adaptive_weighting: true    # Dynamically adjust bin weights
      adaptive_ramp_epochs: 12    # Ramp in fast

  # ============================================================
  # Speaker batching — height-balanced
  # ============================================================
  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 24
    clips_per_speaker: 2
    paired_speakers_per_batch: 6
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.30
    height_bin_weights:
      short: 3.0
      medium: 1.0
      tall: 1.15
    gender_height_weights:
      male_short: 3.0
      female_short: 2.0
      male_tall: 1.10
      female_tall: 1.15
    max_speaker_weight: 3.5

  sample_weighting:
    enabled: false

  # ============================================================
  # Feature smoothing for noise robustness
  # ============================================================
  feature_smoothing_std: 0.020
  lr_warmup_epochs: 0            # Handled by OneCycleLR

  # ============================================================
  # R-Drop regularization
  # ============================================================
  rdrop:
    enabled: true
    weight: 1.0

  # ============================================================
  # TARGET STOP — stop as soon as height_mae_speaker hits 4.0cm
  # stop_only=false means time limit and early stopping still fire as
  # fallbacks if we never hit 4cm within the 5-hour budget.
  # ============================================================
  target_stopping:
    enabled: true
    monitor: height_mae_speaker    # Speaker-level MAE (what matters)
    mode: min
    value: 4.0
    stop_only: false               # Allow time limit & early stopping fallbacks

  # ============================================================
  # EARLY STOPPING — gap-aware with degradation monitoring
  # (backup in case target stop doesn't fire)
  # ============================================================
  early_stopping:
    enabled: true
    patience: 25
    monitor: height_mae_speaker_guarded
    mode: min
    min_delta: 0.001
    degradation_delta: 1.0
    degradation_patience: 8
    gap_threshold: 3.5
    gap_patience: 5

  # ============================================================
  # Gradient clipping — tight for stable OneCycleLR
  # ============================================================
  gradient_clipping:
    enabled: true
    max_norm: 0.5

evaluation:
  targets:
    height_mae_cm: 4.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: false
    n_samples: 16
    n_crops: 3                # 3 crops during training eval = ~40% faster than 5
    crop_size: 128

logging:
  wandb:
    enabled: false
  tensorboard:
    enabled: false
    log_dir: outputs/logs_v5_4cm_5hour/
  checkpoint:
    dir: outputs/checkpoints_v5_4cm_5hour/
    save_top_k: 12
    monitor: height_mae_speaker_guarded
    mode: min

inference:
  checkpoint: outputs/checkpoints_v5_4cm_5hour/best.ckpt
  mc_samples: 16
  deterministic_ensemble: true
  n_crops: 5                  # 5 crops for final inference
  crop_size: 128
  output_uncertainty: true
  output_dir: outputs/predictions_v5_4cm_5hour/
