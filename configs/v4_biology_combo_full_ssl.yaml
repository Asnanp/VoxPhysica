# ============================================================
# VocalMorph V4.5 - Full Combo SSL-Fused
# ============================================================
# Requires data/features_v4_combo_full_ssl built by:
#   scripts/build_ssl_fused_features.py
#
# This is the real "more powerful signal" run: handcrafted biology/acoustics
# plus projected WavLM speaker embeddings from the original WAV files.

project:
  name: VocalMorph-V4-Biology-ComboFull-SSL
  version: "4.5.0"
  author: Asnan P
  description: Full combo V4 trained on SSL-fused WavLM features.

data:
  features_dir: data/features_v4_combo_full_ssl/
  split_manifests:
    train: data/splits/train_plus_heightceleb.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  sample_rate: 16000
  skip_feature_contract_validation: true

model:
  name: VocalMorphV4
  input_dim: 264
  v4:
    adapter_dim: 288
    adapter_heads: 8
    adapter_blocks: 2
    adapter_ff_expansion: 3
    adapter_conv_kernel: 15
    dropout: 0.15
    pool_hidden: 144
    tower_hidden: 288
    meta_dim: 13
    meta_hidden: 64
    use_ssl_backbone: false
    ssl_model_name: "microsoft/wavlm-base-plus"
    ssl_freeze: true
    ssl_layers_to_use: 4

training:
  seed: 37
  epochs: 80
  batch_size: 128
  gradient_accumulation_steps: 1
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  device: cuda
  amp: true
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 480
  train_crop_mode: random
  eval_crop_mode: center
  feature_smoothing_std: 0.0010

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 32
    clips_per_speaker: 4
    height_bin_weights:
      short: 2.35
      medium: 1.00
      tall: 1.10
    gender_height_weights:
      male_short: 2.70
      female_short: 1.20
      male_medium: 1.00
      female_medium: 1.00
      male_tall: 1.00
      female_tall: 1.00
    source_weights:
      TIMIT: 1.35
      NISP: 1.05
      CELEB: 0.15
      HEIGHTCELEB: 0.15
      VOXCELEB: 0.15
      EXTERNAL: 0.15
    max_speaker_weight: 4.00
    balance_gender: true
    gender_balance_strength: 0.25

  sample_weighting:
    enabled: false

  augmentation:
    enabled: true
    noise_p: 0.04
    noise_std: 0.0018
    time_mask_p: 0.04
    time_mask_max_frac: 0.015
    feat_mask_p: 0.030
    feat_mask_max_frac: 0.008
    scale_p: 0.04
    scale_std: 0.008
    temporal_jitter_p: 0.012
    temporal_jitter_max_frac: 0.005
    freq_mask_p: 0.0
    freq_mask_max_frac: 0.0
    mixup_p: 0.0
    mixup_alpha: 0.0

  ema:
    enabled: true
    decay: 0.9985
    update_every: 1
    warmup_steps: 300
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.000055
    weight_decay: 0.012
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: cosine_annealing
    T_max: 80
    eta_min: 0.0000008

  loss:
    huber_delta: 0.75
    huber_weight: 0.48
    mae_weight: 0.42
    smoothl1_weight: 0.10
    gender_weight: 0.06
    label_smoothing: 0.03
    height_bin_loss_weight_short: 1.50
    height_bin_loss_weight_medium: 1.00
    height_bin_loss_weight_tall: 1.05
    height_bin_loss_weight_male_short: 1.70
    height_bin_loss_weight_female_short: 1.10
    height_extreme_short_cm: 152.0
    height_extreme_tall_cm: 190.0
    height_extreme_loss_weight_short: 1.30
    height_extreme_loss_weight_tall: 1.05
    source_loss_weight_timit: 1.15
    source_loss_weight_nisp: 1.05
    source_loss_weight_external: 0.18

  lr_warmup_epochs: 5
  lr_warmup_start_factor: 0.12

  early_stopping:
    enabled: true
    patience: 16
    monitor: height_mae_speaker_balanced
    mode: min

  gradient_clipping:
    enabled: true
    max_norm: 1.0

logging:
  tensorboard:
    enabled: false
    log_dir: outputs/v4_combo_full_ssl/logs/
  checkpoint:
    dir: outputs/v4_combo_full_ssl/checkpoints/
    save_top_k: 3
    monitor: height_mae_speaker_balanced
    mode: min

evaluation:
  targets:
    height_mae_cm: 3.0
    speaker_balanced_mae_cm: 4.0
