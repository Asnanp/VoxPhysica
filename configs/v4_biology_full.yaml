# ============================================================
# VocalMorph V4.1 - Biology-aware full-clip training
# ============================================================
# Purpose:
#   Recover stable learning after the over-regularized "nuclear" run.
#   This uses all full V4 handcrafted/VTL clips (26k train clips), explicit
#   acoustic biology metadata, and real speaker-balanced batches.

project:
  name: VocalMorph-V4-Biology-Full
  version: "4.1.0"
  author: Asnan P
  description: >
    Biology-aware V4 run over the full feature_v4 clip set. This is the
    serious follow-up to the failed nuclear run: smaller stable adapter,
    metadata-conditioned height head, canonical height bins, and balanced
    speaker batches.

data:
  features_dir: data/features_v4/
  split_manifests:
    train: data/splits/train_clean.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  sample_rate: 16000
  skip_feature_contract_validation: true

model:
  name: VocalMorphV4
  input_dim: 136
  v4:
    adapter_dim: 256
    adapter_heads: 8
    adapter_blocks: 2
    adapter_ff_expansion: 3
    adapter_conv_kernel: 15
    dropout: 0.18
    pool_hidden: 128
    tower_hidden: 256
    meta_dim: 13
    meta_hidden: 64
    use_ssl_backbone: false
    ssl_model_name: "facebook/wav2vec2-base"
    ssl_freeze: true
    ssl_layers_to_use: 4

training:
  seed: 31
  epochs: 70
  batch_size: 128
  gradient_accumulation_steps: 1
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  device: cuda
  amp: true
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  feature_smoothing_std: 0.002

  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 32
    clips_per_speaker: 4
    height_bin_weights:
      short: 2.0
      medium: 1.0
      tall: 1.15
    gender_height_weights:
      male_short: 2.4
      female_short: 1.15
      male_medium: 1.0
      female_medium: 1.0
      male_tall: 1.0
      female_tall: 1.0
    max_speaker_weight: 3.5
    balance_gender: true
    gender_balance_strength: 0.25

  sample_weighting:
    enabled: false

  augmentation:
    enabled: true
    noise_p: 0.08
    noise_std: 0.003
    time_mask_p: 0.08
    time_mask_max_frac: 0.025
    feat_mask_p: 0.05
    feat_mask_max_frac: 0.015
    scale_p: 0.08
    scale_std: 0.015
    temporal_jitter_p: 0.03
    temporal_jitter_max_frac: 0.010
    freq_mask_p: 0.0
    freq_mask_max_frac: 0.0
    mixup_p: 0.0
    mixup_alpha: 0.0

  ema:
    enabled: true
    decay: 0.9985
    update_every: 1
    warmup_steps: 200
    use_for_eval: true

  optimizer:
    type: adamw
    lr: 0.00010
    weight_decay: 0.015
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: cosine_annealing
    T_max: 70
    eta_min: 0.000001

  loss:
    huber_delta: 0.75
    huber_weight: 0.45
    mae_weight: 0.45
    smoothl1_weight: 0.10
    gender_weight: 0.08
    label_smoothing: 0.03
    height_bin_loss_weight_short: 1.55
    height_bin_loss_weight_medium: 1.00
    height_bin_loss_weight_tall: 1.10
    height_bin_loss_weight_male_short: 1.75
    height_bin_loss_weight_female_short: 1.10
    height_extreme_short_cm: 152.0
    height_extreme_tall_cm: 190.0
    height_extreme_loss_weight_short: 1.40
    height_extreme_loss_weight_tall: 1.10

  lr_warmup_epochs: 5
  lr_warmup_start_factor: 0.10

  early_stopping:
    enabled: true
    patience: 14
    monitor: height_mae_speaker_balanced
    mode: min

  gradient_clipping:
    enabled: true
    max_norm: 1.0

logging:
  tensorboard:
    enabled: false
    log_dir: outputs/v4_biology_full/logs/
  checkpoint:
    dir: outputs/v4_biology_full/checkpoints/
    save_top_k: 3
    monitor: height_mae_speaker_balanced
    mode: min

evaluation:
  targets:
    height_mae_cm: 3.0
    speaker_balanced_mae_cm: 4.2
