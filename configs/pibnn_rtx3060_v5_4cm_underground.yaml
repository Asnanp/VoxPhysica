# ============================================================
# VocalMorph V5 — 4cm MAE Underground Strategy
# ============================================================
# THIS IS THE REAL DEAL — no surface config tweaks.
#
# What's different from the frontier config:
#   1. BEEFIER MODEL: d_model=256, n_blocks=8, ff_mult=4,
#      n_height_experts=7 — from 1.9M → ~5.5M params
#   2. ADAPTIVE SHORT-WEIGHTING: per-bin MAE tracking dynamically
#      adjusts short/medium/tall weights so the worst bin gets
#      proportional gradient signal
#   3. LOSS SIMPLIFICATION: removed ranking/gate_entropy noise terms,
#      reduced speaker_consistency — focus on Huber+NLL+Bin
#   4. STABLE SCHEDULING: OneCycleLR with lower max_lr (8e-5),
#      longer warmup (33%), gentler ramp (div_factor=12)
#   5. STRONGER REGULARIZATION: weight_decay=0.08,
#      stochastic_depth=0.05, dropout=0.20
#   6. SLOWER CURRICULUM: higher target_label_smoothing decay (0.96)
#      so augmentation noise lasts longer
#   7. ADAPTIVE MONITORING: trains against height_mae_speaker
#      directly, uses guarded only for checkpointing
# ============================================================

project:
  name: VocalMorph
  version: "5.4.0-underground-4cm"
  author: Asnan P
  description: >
    V5.4 underground push for 4cm real-world MAE — beefed-up model,
    adaptive per-bin weighting, simplified loss, stable OneCycleLR.

data:
  features_dir: data/features_vtl_ssl/
  skip_feature_contract_validation: true
  split_manifests:
    train: data/splits/train_clean.csv
    val: data/splits/val_clean.csv
    test: data/splits/test_clean.csv
  targets:
    - height_cm
    - weight_kg
    - age
    - gender

features:
  strict: true
  mfcc:
    n_mfcc: 40
    include_delta: true
    include_delta_delta: true
  formants:
    n_formants: 4

model:
  name: VocalMorphV5
  type: range_aware_speaker_height_architecture
  input_dim: 264
  v5:
    d_model: 256          # was 192 — 1.33x wider
    n_heads: 8            # was 6
    n_blocks: 8           # was 6 — deeper
    ff_mult: 4            # was 3 — wider FFN
    conv_kernel: 15       # was 17 — slightly smaller for more depth
    dropout: 0.20         # was 0.25 — slightly less with more params
    stochastic_depth: 0.05 # was 0.10 — gentler for bigger model
    n_height_experts: 7   # was 5 — finer-grained height coverage
    expert_delta_cm: 12.0 # was 14.0 — tighter expert ranges
    direct_blend: 0.15    # was 0.20 — trust the experts more
    meta_dim: 80          # was 72 — more metadata capacity
    height_bin_classes: 5

physics:
  enabled: false

training:
  seed: 11
  epochs: 120            # more epochs for bigger model to converge
  batch_size: 48
  eval_batch_size: 96
  gradient_accumulation_steps: 2
  num_workers: 0
  eval_num_workers: 0
  persistent_workers: false
  pin_memory: false
  eval_pin_memory: false
  device: cuda
  mixed_precision: true
  allow_tf32: true
  max_feature_frames: 640
  train_crop_mode: random
  eval_crop_mode: center
  non_blocking: true
  empty_cache_frequency: 10
  gradient_checkpointing: false
  train_eval_frequency: 1
  final_train_eval: true

  # ============================================================
  # Curriculum augmentation — stronger early, decays slower
  # ============================================================
  augmentation:
    enabled: true
    noise_p: 0.35
    noise_std: 0.012       # slightly less noise
    time_mask_p: 0.25
    time_mask_max_frac: 0.060
    feat_mask_p: 0.18
    feat_mask_max_frac: 0.040
    scale_p: 0.20
    scale_std: 0.040
    temporal_jitter_p: 0.10
    temporal_jitter_max_frac: 0.025
    freq_mask_p: 0.10
    freq_mask_max_frac: 0.12
    mixup_p: 0.20
    mixup_alpha: 0.25
    total_epochs: 120

  # ============================================================
  # Target label smoothing — curriculum noise, decays SLOWER
  # (0.96 vs 0.94 means noise persists longer into training)
  # ============================================================
  target_label_smoothing:
    enabled: true
    std: 0.10              # was 0.12
    decay: 0.96            # was 0.94 — slower decay, model learns longer with noise

  # ============================================================
  # EMA for smooth evaluation
  # ============================================================
  ema:
    enabled: true
    decay: 0.9995          # was 0.9992 — smoother EMA for bigger model
    update_every: 1
    warmup_steps: 1000     # was 500 — more warmup steps
    use_for_eval: true

  # ============================================================
  # SWA — start later, anneal longer for 4cm stability
  # ============================================================
  swa:
    enabled: true
    start_frac: 0.55       # was 0.50 — start at 55% (epoch 66/120)
    anneal_epochs: 25      # was 20
    use_for_eval: true

  # ============================================================
  # Optimizer — higher weight_decay for stronger generalization
  # ============================================================
  optimizer:
    type: adamw
    lr: 0.00008            # was 0.00012 — lower, more stable for bigger model
    weight_decay: 0.08     # was 0.06 — stronger regularization
    betas: [0.9, 0.995]
    eps: 1e-8

  # ============================================================
  # Scheduler — OneCycleLR with gentler ramp, longer tail
  # ============================================================
  scheduler:
    type: one_cycle_lr
    max_lr: 0.00008
    pct_start: 0.33        # was 0.25 — longer warmup
    anneal_strategy: cos
    div_factor: 12         # was 20 — gentler initial LR ramp
    final_div_factor: 8000 # was 5000 — allow LR to go lower
    eta_min: 0.000001

  # ============================================================
  # Loss — UNDERGROUND CHANGES:
  #   - Removed ranking_weight (was 0.15) — adds gradient noise
  #   - Removed gate_entropy_weight (was 0.005) — fights confident gating
  #   - Reduced speaker_consistency (0.12 → 0.05)
  #   - Increased height_huber (0.50 → 0.55) — primary signal
  #   - Increased height_bin (0.30 → 0.35) — better auxiliary
  #   - short_weight=2.5 + adaptive_weighting dynamically adjusts
  # ============================================================
  loss:
    type: vtsl_v2
    use_gender_class_weights: false
    domain_grl_lambda_min: 0.0
    domain_grl_lambda_max: 0.0
    v5:
      height_nll_weight: 0.20
      height_huber_weight: 0.55
      height_mae_weight: 0.30
      weight_weight: 0.04
      age_weight: 0.02
      gender_weight: 0.08
      height_bin_weight: 0.35
      ranking_weight: 0.0       # REMOVED — was 0.15
      speaker_consistency_weight: 0.05  # reduced from 0.12
      gate_entropy_weight: 0.0   # REMOVED — was 0.005
      short_weight: 2.50
      medium_weight: 1.00
      tall_weight: 1.20
      huber_delta_norm: 0.45
      rank_margin_cm: 2.5
      adaptive_weighting: true   # NEW — dynamic per-bin weight adjustment
      adaptive_ramp_epochs: 20   # ramp in over 20 epochs

  # ============================================================
  # Speaker batching — height-balanced with gender balance
  # ============================================================
  speaker_batching:
    enabled: true
    mode: height_balanced
    speakers_per_batch: 24
    clips_per_speaker: 2
    paired_speakers_per_batch: 6
    singleton_speakers_per_batch: 8
    balance_gender: true
    gender_balance_strength: 0.30
    height_bin_weights:
      short: 2.5
      medium: 1.0
      tall: 1.15
    gender_height_weights:
      male_short: 2.5
      female_short: 1.75
      male_tall: 1.10
      female_tall: 1.15
    max_speaker_weight: 3.0

  sample_weighting:
    enabled: false

  # ============================================================
  # Feature smoothing for noise robustness
  # ============================================================
  feature_smoothing_std: 0.015  # was 0.020 — slightly less noise
  lr_warmup_epochs: 0           # no warmup — OneCycleLR handles it
  lr_warmup_start_factor: 0.05  # fallback, not used with OneCycleLR

  # ============================================================
  # Early stopping — monitors height_mae_speaker directly
  # Uses degradation monitoring for safety
  # Gap-aware stopping with higher threshold for bigger model
  # ============================================================
  early_stopping:
    enabled: true
    patience: 35           # was 30 — more patience for bigger model
    monitor: height_mae_speaker  # was height_mae_speaker_guarded — train directly on speaker MAE
    mode: min
    min_delta: 0.001       # was 0.002 — tighter threshold
    degradation_delta: 1.0
    degradation_patience: 8  # was 6
    gap_threshold: 3.5     # was 3.0 — slightly more tolerance
    gap_patience: 5        # was 4

  # ============================================================
  # R-Drop regularization — two forward passes with different
  # dropout masks, MSE consistency loss between them.
  # Forces model to produce stable predictions despite dropout.
  # Extremely effective for this type of stochastic model.
  # ============================================================
  rdrop:
    enabled: true
    weight: 0.8            # KL/MSE consistency weight

  # ============================================================
  # Gradient clipping — tighter for stable training
  # ============================================================
  gradient_clipping:
    enabled: true
    max_norm: 0.5          # was 0.6 — tighter

evaluation:
  targets:
    height_mae_cm: 3.0
    weight_mae_kg: 5.0
    age_mae_years: 5.0
    gender_accuracy: 0.95
  inference:
    use_ensemble: true
    deterministic: false
    n_samples: 16
    n_crops: 3
    crop_size: 96

logging:
  wandb:
    enabled: false
  tensorboard:
    enabled: false
    log_dir: outputs/logs_v5_4cm_underground/
  checkpoint:
    dir: outputs/checkpoints_v5_4cm_underground/
    save_top_k: 10
    monitor: height_mae_speaker
    mode: min

inference:
  checkpoint: outputs/checkpoints_v5_4cm_underground/best.ckpt
  mc_samples: 16
  deterministic_ensemble: true
  n_crops: 3
  crop_size: 96
  output_uncertainty: true
  output_dir: outputs/predictions_v5_4cm_underground/
